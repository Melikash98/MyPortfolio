<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mshooryabi.com</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/upgerade-website.css" />
    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <meta name="google-site-verification" content="c90EYqFA5SkozbS_Jdh_0YUdy-NhvHxr5TCZ3IIXfjQ" />
</head>

<body>
    <div class="logo"><img src="../images/logo.png" alt="Logo" /></div>
    <div class="containerCard">
        <div class="main-text">
            <h1 class="tittle-text">Currently Evolving <i class="ri-loader-2-fill"></i></h1>
            <h4>I’m working on something better for you.</h4>
        </div>
        <div class="main-card">
            <div class="card">
                <div class="icon-card">
                    <div class="img-card"><a href="https://www.linkedin.com/in/melika-shooryabi" target="_blank"><img
                                src="../images/linkedin-upgerade-website.png" alt="Linkedin"></a></div>
                    <h3>Linkedin</h3>
                </div>
            </div>
            <div class="card">
                <div class="icon-card">
                    <div class="img-card"><a href="https://github.com/Melikash98" target="_blank"><img src="../images/github-upgerade-website.png"
                                alt="GitHub"></a></div>
                    <h3>GitHub</h3>
                </div>
            </div>
            <div class="card">
                <div class="icon-card">
                    <div class="img-card"><a href="mailto:melika.shooryabi24@gmail.com" target="_blank"><img
                                src="../images/google-hangoutschat-upgerade-website.png" alt="Email"></a></div>
                    <h3>Email</h3>
                </div>
            </div>
            <div class="card">
                <div class="icon-card">
                    <div class="img-card"><img src="../images/youtube-upgerade-website.png" alt="YouTube"></div>
                    <h3>YouTube</h3>
                </div>
            </div>
        </div>
        <div class="countdown">
            <div class="time-box">
                <span id="days">10</span>
                <small>Days</small>
            </div>

            <div class="separator">:</div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="separator">:</div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="separator">:</div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>
    </div>
    <script src="../js/upgerade-website.js"></script>
</body>


</html>
